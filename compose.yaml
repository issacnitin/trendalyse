name: trendalyse
services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: ./deploy/secrets/app.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      WEB_ORIGIN: https://trendalyse.com
      ACCOUNT_DATABASE_PATH: /data/accounts.sqlite
      AI_DAILY_LIMIT: "5"
    volumes:
      - accounts:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    networks: [private, app-egress]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run --token-file /run/secrets/tunnel-token
    user: "65532:65532"
    volumes:
      - ./deploy/secrets/tunnel-token:/run/secrets/tunnel-token:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      app:
        condition: service_healthy
    networks: [private, tunnel-egress]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  private:
    internal: true
  app-egress: {}
  tunnel-egress: {}
volumes:
  accounts: {}
